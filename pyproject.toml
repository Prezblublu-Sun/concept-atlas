[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-atlas"
version = "0.1.0"
description = "Turn a corpus of research PDFs into a browsable, queryable, citable concept system with sentence-level provenance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=1.24",
  "pyyaml>=6",
  "numpy>=1.26",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3", "torch"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["defaults.yaml", "store/sql/*.sql", "http/static/**/*", "llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
