# Every tunable with its default. A project's project.yaml overrides keys here (deep merge).
doc_type: paper                       # paper | thesis; a manifest column may override per document
paths:
  pdf_dir: pdf                        # relative to the project root unless absolute
ingest:
  sentence_min_chars: 3
  page_render_zoom: 1.6
llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: ATLAS_LLM_API_KEY
  concurrency: 8
  prefer_idle: true
  balance_floor_rmb: 5
  balance_endpoint: /user/balance
  pricing:
    currency: RMB
    per_million: { input_miss: 1.0, input_hit: 0.02, output: 4.0 }
    peak_multiplier: 2
    peak: { tz_offset_hours: 8, weekdays: [0, 1, 2, 3, 4], hours: [[9, 12], [14, 18]] }
budgets:
  run: 80
  stage: { overview: 60 }
  daily: { ask: 2 }
overview:
  mode_by_tier: { A: deep, B: deep, C: lite, D: lite, E: skip }
  stale_ratio: 0.10
  stale_min_added: 30
  per_unit_cap: 40
stats:                                # v2 counting rules (atlas/core/stats.py); every value is a count-derived threshold
  cov_hi: 0.10                        # tier A/B: coverage >= 10 %
  topic_hi: 0.10                      # tier A/C: topic rate >= 10 %
  min_papers: 5                       # tier E below this many documents
  year_bins: [["≤2015", null, 2015], ["2016–2020", 2016, 2020], ["2021–2023", 2021, 2023], ["2024–2026", 2024, 2026]]
  trend_early_bins: ["≤2015", "2016–2020"]
  trend_late_bins: ["2024–2026"]
  trend_min_n: 30                     # both windows need this many documents for a trend
  trend_up: 2.0
  trend_down: 0.5
  trend_min_k: 10
  strong_abstract_hits: 2             # sub-domain 'core' when anchors appear this often in the abstract
  body_extra_sections: [appendix]     # counted as body besides the is_body sentences (the previous system counted appendices)
  body_includes_title: true           # title-field hits add to 'body' (the previous system's full text began with the title line)
qa:
  accept_threshold: 0.85
embedding:
  model: bge-m3
  url: ""                             # e.g. http://my-gpu-box:8790 (atlas embed serve)
serve:
  host: 127.0.0.1
  port: 8770                          # 8765-8767 belong to the earlier term viewers; binding is exclusive
