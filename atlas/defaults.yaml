# Every tunable with its default. A project's project.yaml overrides keys here (deep merge).
doc_type: paper                       # paper | thesis; a manifest column may override per document
paths:
  pdf_dir: pdf                        # relative to the project root unless absolute
ingest:
  sentence_min_chars: 3
  page_render_zoom: 1.6
llm:                                  # increment 4 §1.2: the providers the LLM stages talk to (atlas/llm/client.py)
  provider: anthropic                 # primary provider: anthropic | deepseek | fake (its currency is the budget currency)
  model: claude-opus-5-5              # the primary provider's model (user's choice; the defaults stay Opus 5.5 / medium)
  models: { anthropic: claude-opus-5-5, deepseek: deepseek-flash }   # per-provider models for the split
  effort: medium                      # low | medium | high | xhigh | max (anthropic only; the model's thinking depth)
  api_key_env: RS_ANTHROPIC_API_KEY   # deliberately NOT ANTHROPIC_API_KEY (Claude Code would pick that one up); resolved
                                      # from the process environment, then HKCU\Environment, then the system environment
  split: { anthropic: 0.9, deepseek: 0.1 }   # share of items per provider (policy 2026-10-23: Claude first, ~9:1, so the two
                                      # can be compared); an item's provider = sha1(item key) → stable across runs; absent →
                                      # 1.0 for `provider`
  failover: false                     # true: an item whose provider fails (transport error) is re-run on another provider
                                      # of the split; such ledger rows carry failover = 1
  fx: { USD: 1.0, RMB: 0.14 }         # value of one unit of each currency in USD — budgets and reports across providers
  max_tokens: 8192                    # default output cap per request (a task may set its own)
  max_tokens_cap: 65536               # the ×2 retry after `max_tokens` never exceeds this
  batch_default: true                 # stages run in --mode batch unless told otherwise (half price, asynchronous);
                                      # a provider without a batch API (DeepSeek) runs its share live
  batch_poll_seconds: 30              # `atlas run <stage> --wait`: seconds between two polls of a running batch
  max_retries: 2                      # SDK-level retries of 429 / 5xx / connection errors (+ one outer attempt)
  refusal_fallback: true              # beta server-side refusal fallback (`fallbacks: "default"`), live calls only
  concurrency: 4
  prefer_idle: true                   # DeepSeek only: warn when a run starts inside the provider's peak hours
  deepseek:                           # kept so a project can switch / split providers; no new features
    base_url: https://api.deepseek.com
    api_key_env: RS_DEEPSEEK_API_KEY  # same resolution order as the Anthropic key
    balance_endpoint: /user/balance
    balance_floor_rmb: 5
    extra_body: {}                    # merged into every chat/completions body (e.g. {thinking: {type: disabled}})
    peak: { tz_offset_hours: 8, weekdays: [0, 1, 2, 3, 4], hours: [[9, 12], [14, 18]] }
    peak_multiplier: 2
  pricing:                            # per million tokens, in `currency`; batch rows are × batch_multiplier
    claude-opus-5-5:   { input: 4.0,  output: 20.0, cache_write: 5.0,   cache_read: 0.20, currency: USD, batch_multiplier: 0.5 }
    claude-sonnet-5-5: { input: 2.0,  output: 10.0, cache_write: 2.5,   cache_read: 0.20, currency: USD, batch_multiplier: 0.5 }
    claude-haiku-5-5:  { input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01, currency: USD, batch_multiplier: 0.5 }
    deepseek-flash:    { input: 1.0,  output: 4.0,  cache_write: 1.0,   cache_read: 0.02, currency: RMB, batch_multiplier: 1.0 }
    fake:              { input: 4.0,  output: 20.0, cache_write: 5.0,   cache_read: 0.20, currency: USD, batch_multiplier: 0.5 }
budgets:                              # in the provider currency (increment 4 §1.5)
  run: 80                             # default --budget of one stage run
  stage: { terms: 40, concepts: 20, scheme: 5, classify: 30, overview: 60 }
  daily: { total: 150, ask: 2 }       # total: project-wide spend per calendar day; ask: later increments
overview:
  mode_by_tier: { A: deep, B: deep, C: lite, D: lite, E: skip }
  stale_ratio: 0.10
  stale_min_added: 30
  per_unit_cap: 40
stats:                                # v2 counting rules (atlas/core/stats.py); every value is a count-derived threshold
  cov_hi: 0.10                        # tier A/B: coverage >= 10 %
  topic_hi: 0.10                      # tier A/C: topic rate >= 10 %
  min_papers: 5                       # tier E below this many documents
  year_bins: [["≤2015", null, 2015], ["2016–2020", 2016, 2020], ["2021–2023", 2021, 2023], ["2024–2026", 2024, 2026]]
  trend_early_bins: ["≤2015", "2016–2020"]
  trend_late_bins: ["2024–2026"]
  trend_min_n: 30                     # both windows need this many documents for a trend
  trend_up: 2.0
  trend_down: 0.5
  trend_min_k: 10
  strong_abstract_hits: 2             # sub-domain 'core' when anchors appear this often in the abstract
  body_extra_sections: [appendix]     # counted as body besides the is_body sentences (the previous system counted appendices)
  body_includes_title: true           # title-field hits add to 'body' (the previous system's full text began with the title line)
qa:
  accept_threshold: 0.85
embedding:
  model: bge-m3
  url: ""                             # e.g. http://my-gpu-box:8790 (atlas embed serve)
serve:
  host: 127.0.0.1
  port: 8770                          # 8765-8767 belong to the earlier term viewers; binding is exclusive
